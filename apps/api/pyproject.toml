[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "prism-api"
version = "1.0.0"
description = "PRISM Analytics Core & Intelligence API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.31.0",
    "pydantic>=2.9.0",
    "pandas>=2.2.0",
    "duckdb>=1.1.0",
    "sqlglot>=25.20.0,<31"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.6.9",
    "mypy>=1.11.2"
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
  "E501",
  "UP042",  # Enum(str, Enum) mantido: StrEnum muda o str() e a serialização existente
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
