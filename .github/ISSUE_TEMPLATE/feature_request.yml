name: ✨ Melhoria
description: Proponha uma funcionalidade ou mudança.
labels: ["type: feature", "status: triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Qual problema isso resolve?
      description: Contexto e impacto para quem usa. Foque no problema, não na solução.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposta
      description: Como você imagina a solução? Inclua exemplos de API, CLI ou tela se ajudar.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternativas consideradas
  - type: checkboxes
    id: contribution
    attributes:
      label: Contribuição
      options:
        - label: Posso abrir um PR com a implementação.
