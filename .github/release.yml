# Categorias das notas de release geradas automaticamente pelo GitHub.
changelog:
  exclude:
    labels: ["skip-changelog"]
    authors: ["dependabot", "github-actions"]
  categories:
    - title: 🚀 Funcionalidades
      labels: ["type: feature"]
    - title: 🐞 Correções
      labels: ["type: bug"]
    - title: 🔒 Segurança
      labels: ["type: security"]
    - title: ⚡ Performance
      labels: ["type: perf"]
    - title: 📚 Documentação
      labels: ["type: docs"]
    - title: 🧰 Manutenção
      labels: ["*"]
